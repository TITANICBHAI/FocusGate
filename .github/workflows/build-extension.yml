name: Build browser extension

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Build and package FocusGate
    if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build and validate browser packages
        uses: ./.github/actions/build-extension

  release:
    name: Publish direct browser ZIP downloads
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build and validate browser packages
        uses: ./.github/actions/build-extension

      - name: Attach browser ZIPs to the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="$GITHUB_REF_NAME"
          assets=(
            build/focusgate-chrome.zip
            build/focusgate-edge.zip
            build/focusgate-firefox.zip
          )

          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "${assets[@]}" --clobber
          else
            gh release create "$tag" "${assets[@]}" \
              --title "FocusGate $tag" \
              --generate-notes
          fi