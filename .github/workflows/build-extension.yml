name: Build browser extension

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and package FocusGate
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build extension
        run: bun run build:extension

      - name: Package extension
        run: bun run package:extension

      - name: Package Firefox extension
        run: bun run package:firefox

      - name: Prepare store submission bundle
        run: bun run prepare:store

      - name: Validate packaged extensions
        run: |
          for archive in build/focusgate-extension.zip build/focusgate-firefox.zip; do
            unzip -l "$archive"
            unzip -p "$archive" manifest.json | node -e '
              let input = "";
              process.stdin.on("data", chunk => input += chunk);
              process.stdin.on("end", () => {
                const manifest = JSON.parse(input);
                if (manifest.manifest_version !== 3) process.exit(1);
                if (!manifest.background?.service_worker) process.exit(1);
                if (!manifest.icons?.["128"]) process.exit(1);
                console.log(`Validated ${manifest.name} ${manifest.version}`);
              });
            '
          done

      - name: Upload extension ZIP
        uses: actions/upload-artifact@v4
        with:
          name: focusgate-store-submission-${{ github.sha }}
          path: build/store-submission
          if-no-files-found: error
          retention-days: 30