name: Build and validate browser extensions
description: Build FocusGate and package the Chrome, Edge, and Firefox ZIPs

runs:
  using: composite
  steps:
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20

    - name: Install dependencies
      shell: bash
      run: |
        rm -f package-lock.json
        npm install --no-audit --no-fund

    - name: Report install state
      shell: bash
      run: |
        echo "::notice::cwd=$(pwd)"
        echo "::notice::node_modules=$(test -d node_modules && echo present || echo MISSING)"
        echo "::notice::types-dir=$(ls node_modules/@types 2>/dev/null | tr '\n' ' ')"
        echo "::notice::react=$(test -d node_modules/react && echo present || echo MISSING)"
        echo "::notice::types-react=$(test -d node_modules/@types/react && echo present || echo MISSING)"
        echo "::notice::vite-client=$(test -f node_modules/vite/client.d.ts && echo present || echo MISSING)"
        echo "::notice::vite-importmeta=$(test -f node_modules/vite/types/importMeta.d.ts && echo present || echo MISSING)"
        echo "::notice::typescript-version=$(node -p "require('./node_modules/typescript/package.json').version" 2>&1 | tail -1)"
        echo "::notice::types-react-version=$(node -p "require('./node_modules/@types/react/package.json').version" 2>&1 | tail -1)"
        echo "::notice::npm-omit=$(npm config get omit 2>/dev/null || echo unknown) node_env=${NODE_ENV:-unset}"

    - name: Typecheck
      shell: bash
      run: |
        set -o pipefail
        npm run typecheck 2>&1 | tee /tmp/typecheck.log || {
          echo "::error::TYPECHECK FAILED — last log lines, reverse order:"
          tail -6 /tmp/typecheck.log | tac | while IFS= read -r line; do
            [ -n "$line" ] && echo "::error::${line//%/%25}"
          done
          exit 1
        }

    - name: Test
      shell: bash
      run: |
        set -o pipefail
        npm test 2>&1 | tee /tmp/test.log || {
          echo "::error::TEST STEP FAILED — last log lines, reverse order:"
          tail -14 /tmp/test.log | tac | while IFS= read -r line; do
            [ -n "$line" ] && echo "::error::${line//%/%25}"
          done
          exit 1
        }

    - name: Build extension
      shell: bash
      run: |
        set -o pipefail
        npm run build 2>&1 | tee /tmp/build.log || {
          echo "::error::BUILD STEP FAILED — error lines:"
          grep -aE "Error|ERROR|error|ERR_|Cannot|Could not|✘|Failed|failed" /tmp/build.log | tail -12 | tac | while IFS= read -r line; do
            [ -n "$line" ] && echo "::error::${line//%/%25}"
          done
          echo "::error::— code frame around the first esbuild error:"
          grep -a -B6 -A10 -m1 "SettingsView.tsx:384" /tmp/build.log | tac | while IFS= read -r line; do
            [ -n "$line" ] && echo "::error::${line//%/%25}"
          done
          echo "::error::— raw tail:"
          tail -4 /tmp/build.log | tac | while IFS= read -r line; do
            [ -n "$line" ] && echo "::error::${line//%/%25}"
          done
          exit 1
        }

    - name: Package Chrome extension
      shell: bash
      run: npm run package:chrome

    - name: Package Edge extension
      shell: bash
      run: npm run package:edge

    - name: Package Firefox extension
      shell: bash
      run: npm run package:firefox

    - name: Validate packaged extensions
      shell: bash
      run: |
        for archive in build/focusgate-chrome.zip build/focusgate-edge.zip build/focusgate-firefox.zip; do
          unzip -tq "$archive"
          manifest="$(unzip -p "$archive" manifest.json)"
          printf "%s" "$manifest" | ARCHIVE="$archive" node -e '
            let input = "";
            process.stdin.on("data", chunk => input += chunk);
            process.stdin.on("end", () => {
              const manifest = JSON.parse(input);
              if (manifest.manifest_version !== 3) process.exit(1);
              if (!manifest.icons?.["128"]) process.exit(1);
              if (process.env.ARCHIVE.endsWith("focusgate-firefox.zip")) {
                if (manifest.background?.service_worker) {
                  throw new Error("Firefox must not include the unsupported service_worker key.");
                }
                const gecko = manifest.browser_specific_settings?.gecko;
                if (!manifest.background?.scripts?.includes("background.js")) {
                  throw new Error("Firefox background.scripts is missing.");
                }
                if (!gecko?.id) throw new Error("Firefox Gecko add-on ID is missing.");
                if (JSON.stringify(gecko.data_collection_permissions?.required) !== "[\"none\"]") {
                  throw new Error("Firefox data_collection_permissions must declare required: [\"none\"].");
                }
                if (gecko.strict_min_version !== "140.0") {
                  throw new Error("Firefox desktop minimum version must be 140.0 or newer.");
                }
                if (manifest.browser_specific_settings?.gecko_android?.strict_min_version !== "142.0") {
                  throw new Error("Firefox for Android minimum version must be 142.0 or newer.");
                }
              } else if (!manifest.background?.service_worker) {
                throw new Error("Chromium background service_worker is missing.");
              }
              console.log(`Validated ${manifest.name} ${manifest.version}`);
            });
          '
        done

    - name: Upload Chrome package
      uses: actions/upload-artifact@v4
      with:
        name: focusgate-chrome-${{ github.sha }}
        path: build/focusgate-chrome.zip
        if-no-files-found: error
        retention-days: 30

    - name: Upload Edge package
      uses: actions/upload-artifact@v4
      with:
        name: focusgate-edge-${{ github.sha }}
        path: build/focusgate-edge.zip
        if-no-files-found: error
        retention-days: 30

    - name: Upload Firefox package
      uses: actions/upload-artifact@v4
      with:
        name: focusgate-firefox-${{ github.sha }}
        path: build/focusgate-firefox.zip
        if-no-files-found: error
        retention-days: 30
